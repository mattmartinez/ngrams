schema_version: "1.1"
name: questdb-designated-timestamp
expected_outcome: |
  The report reads the EXPLAIN correctly: a Frame backward scan over every
  partition because the time predicate is on ingested_at, not the designated
  timestamp ts; the LIMIT is pushed into the Async JIT Filter, and ORDER BY ts
  DESC is already a backward scan (no sort node), so the only lever left is
  partition pruning. The primary fix is
  to put the time bound on ts (ingested_at is at most minutes behind ts, so bound
  ts to the same window with a small margin) so the plan becomes an Interval scan
  with partition pruning, and to let ORDER BY ts DESC become a backward scan. It
  treats "add an index on device" as a second, conditional step: it helps only if
  the device value is selective within the scanned interval, it doubles writes on
  that column, and the user is already near the O3 lag ceiling, so test it on a
  copy or off-peak and watch ingestion before keeping it. It explains that
  QuestDB has no EXPLAIN ANALYZE and proposes verification by re-running EXPLAIN
  (Interval scan present), timing the query from the client warm (run twice), and
  watching query_activity() memory and state. It does not propose PostgreSQL
  features (CREATE INDEX CONCURRENTLY, pg_stat_statements, VACUUM, B-tree) and
  does not propose repartitioning as a first step.
context:
  scaffold_script: place-files.sh
