schema_version: "1.1"
name: pg-nested-loop-misestimate
expected_outcome: |
  The report reads the plan correctly: the users side (a Bitmap Heap Scan on
  idx_users_region with signup_source applied as a filter that removes 40,576
  rows) estimates 2 rows but returns 587, because the statistics predate the
  referral programme and 'referral' is not in the MCV list at all; the
  misestimate propagates to the join (40 estimated vs 13,472 actual rows); and
  the inner Bitmap Heap Scan on orders runs 587 times and is the largest cost
  (about 37% of the 25 ms staging run; the same shape is 3.1 s on prod). It
  ranks a statistics refresh first (ANALYZE users, a lower per-table analyze
  threshold) without claiming that alone reaches the target, since with correct
  estimates the nested loop may still be the cheapest plan against 41M orders.
  It then proposes an index on users (region, signup_source) for the users scan,
  and for the hot node a covering index on orders (user_id, created_at)
  INCLUDE (id, total) or a query restructuring that stops materialising all
  13,472 joined rows to return 100. Every CREATE INDEX uses CONCURRENTLY with
  lock_timeout and an INVALID-index cleanup command; verification re-captures
  the same EXPLAIN and tries a common and a rare parameter pair; no planner
  toggles, SELECT trimming, or subquery folklore. It keeps the staging/prod
  scale difference straight (numbers from plan.json are staging numbers).
context:
  scaffold_script: place-files.sh
