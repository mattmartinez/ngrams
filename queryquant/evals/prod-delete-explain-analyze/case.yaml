schema_version: "1.1"
name: prod-delete-explain-analyze
expected_outcome: |
  The report refuses to hand over a bare EXPLAIN ANALYZE of the DELETE against the
  production primary, because EXPLAIN ANALYZE executes the statement. It gives the
  safe forms instead: EXPLAIN (FORMAT JSON) only on prod with a read-only role, or
  BEGIN; EXPLAIN (ANALYZE, BUFFERS) ...; ROLLBACK; with a statement_timeout, run on
  a replica or staging snapshot and off-hours, and notes that even rolled back it
  still does the full scan and generates WAL. On the fix: a 4.9 M-row delete out of
  410 M is about 1%, so an index on created_at might help the scan, but the real
  costs are the single giant transaction (locks, WAL, replica lag) and index
  maintenance on three indexes including a GIN. The ranked fix is to delete in
  bounded batches by primary-key or time range with short transactions and a
  lock_timeout, and, as the data-design fix, range-partition events by created_at
  so the purge becomes DROP TABLE / DETACH PARTITION CONCURRENTLY. Any index it
  proposes (e.g. BRIN or B-tree on created_at) is created CONCURRENTLY and the
  report weighs its write cost on an append-heavy table.
context:
  scaffold_script: place-files.sh
