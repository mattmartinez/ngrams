schema_version: "1.1"
name: mysql-covering-index
expected_outcome: |
  The report reads the plan correctly: the optimizer chose a backward scan of
  idx_orders_created (access_type index, backward_index_scan true) and applies
  both predicates as a filter (filtered 0.50%), betting that the LIMIT 20 is
  satisfied after a few hundred rows (rows_examined_per_scan 397 is that bet).
  For a merchant with many recent open orders that is fast; for one with few or
  zero open orders it walks the whole index and fetches every row from the
  clustered PK before giving up, which is the p95. It proposes one composite
  index in the right column order, customer_id, status, created_at, so the
  equality prefix plus the ordering column lets the LIMIT stop after 20 index
  entries for every merchant, and optionally includes total to make it covering
  (noting id comes free from the clustered PK). The DDL uses ALTER TABLE ... ADD
  INDEX ..., ALGORITHM=INPLACE, LOCK=NONE with a session lock_wait_timeout,
  mentions ANALYZE TABLE afterwards and Aurora replica lag during the build, and
  gives a write-side cost (one more secondary index on ~2,400 inserts and ~900
  status updates per minute; the status updates now touch this index; Aurora has
  no change buffer). It says whether idx_orders_customer becomes redundant and
  how to check before dropping it.
context:
  scaffold_script: place-files.sh
